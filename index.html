<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinobi Bout v1.0 — Web Engine</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
    --accent-gold: #f59e0b;
    --accent-green: #10b981;
    --accent-purple: #8b5cf6;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-light); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

  .game-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
  header { text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px; }
  header h1 { font-size: 1.8rem; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; }
  
  /* Battlefield Area */
  .battlefield { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 15px; position: relative; }
  .player-zone { display: flex; flex-direction: column; gap: 10px; }
  .player-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; }
  
  /* Active Card UI */
  .active-card { background: var(--card-bg); border: 2px solid #475569; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: all 0.3s ease; }
  .active-card.p1 { border-color: var(--accent-blue); }
  .active-card.p2 { border-color: var(--accent-red); }
  
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: 1.2rem; font-weight: bold; }
  .card-element { font-size: 0.85rem; padding: 2px 8px; border-radius: 12px; background: #334155; }
  
  .element-Fire { color: #f87171; }
  .element-Wind { color: #34d399; }
  .element-Lightning { color: #facc15; }
  .element-Earth { color: #fb923c; }
  .element-Water { color: #60a5fa; }

  .hp-bar-container { background: #334155; height: 14px; border-radius: 7px; overflow: hidden; position: relative; }
  .hp-bar-fill { background: var(--accent-green); height: 100%; width: 100%; transition: width 0.3s ease; }
  .hp-text { position: absolute; width: 100%; text-align: center; font-size: 0.75rem; line-height: 14px; font-weight: bold; text-shadow: 0 0 2px black; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 0.85rem; text-align: center; background: #0f172a; padding: 6px; border-radius: 6px; }
  .status-badges { display: flex; gap: 5px; min-height: 20px; flex-wrap: wrap; }
  .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: var(--accent-purple); font-weight: bold; }

  /* Bench Units */
  .bench-container { display: flex; gap: 8px; }
  .bench-unit { background: #0f172a; border: 1px dashed #475569; padding: 6px; border-radius: 6px; flex: 1; font-size: 0.75rem; text-align: center; cursor: pointer; }
  .bench-unit.active { border-style: solid; border-color: var(--accent-gold); }
  .bench-unit.dead { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }

  /* Chakra Meter */
  .chakra-container { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; display: flex; align-items: center; justify-content: space-between; }
  .chakra-dots { display: flex; gap: 4px; }
  .chakra-dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
  .chakra-dot.active { background: var(--accent-blue); box-shadow: 0 0 6px var(--accent-blue); }

  /* Controls Panel */
  .controls-panel { background: var(--card-bg); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  
  button { background: #334155; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
  button:hover:not(:disabled) { background: #475569; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.btn-primary { background: var(--accent-blue); }
  button.btn-primary:hover:not(:disabled) { background: #2563eb; }
  button.btn-special { background: var(--accent-purple); }
  button.btn-special:hover:not(:disabled) { background: #7c3aed; }

  /* Match Log Box */
  .log-box { background: #020617; border: 1px solid #334155; border-radius: 8px; height: 140px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
  .log-entry { margin: 0; line-height: 1.3; }
  .log-p1 { color: #60a5fa; }
  .log-p2 { color: #f87171; }
  .log-sys { color: var(--accent-gold); }

  @media (max-width: 600px) {
    .battlefield { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="game-container">
  <header>
    <h1>🥷 Shinobi Bout v1.0</h1>
  </header>

  <div class="battlefield">
    <!-- PLAYER 1 ZONE -->
    <div class="player-zone">
      <div class="player-header">
        <span style="color: var(--accent-blue)">Player 1 (You)</span>
      </div>
      <div class="active-card p1" id="p1-card">
        <div class="card-top">
          <span class="card-name" id="p1-name">Naruto Uzumaki</span>
          <span class="card-element element-Wind" id="p1-elem">Wind</span>
        </div>
        <div class="hp-bar-container">
          <div class="hp-bar-fill" id="p1-hp-fill"></div>
          <div class="hp-text" id="p1-hp-text">120 / 120</div>
        </div>
        <div class="stats-grid">
          <div>⚔️ ATK: <span id="p1-atk">35</span></div>
          <div>🛡️ DEF: <span id="p1-def">30</span></div>
          <div>💨 SPD: <span id="p1-spd">35</span></div>
        </div>
        <div class="status-badges" id="p1-statuses"></div>
      </div>

      <div class="chakra-container">
        <span>🌀 Chakra:</span>
        <div class="chakra-dots" id="p1-chakra-dots"></div>
      </div>

      <div class="bench-container" id="p1-bench"></div>
    </div>

    <!-- PLAYER 2 ZONE -->
    <div class="player-zone">
      <div class="player-header">
        <span style="color: var(--accent-red)">Player 2 (AI)</span>
      </div>
      <div class="active-card p2" id="p2-card">
        <div class="card-top">
          <span class="card-name" id="p2-name">Sasuke Uchiha</span>
          <span class="card-element element-Lightning" id="p2-elem">Lightning</span>
        </div>
        <div class="hp-bar-container">
          <div class="hp-bar-fill" id="p2-hp-fill"></div>
          <div class="hp-text" id="p2-hp-text">110 / 110</div>
        </div>
        <div class="stats-grid">
          <div>⚔️ ATK: <span id="p2-atk">40</span></div>
          <div>🛡️ DEF: <span id="p2-def">28</span></div>
          <div>💨 SPD: <span id="p2-spd">38</span></div>
        </div>
        <div class="status-badges" id="p2-statuses"></div>
      </div>

      <div class="chakra-container">
        <span>🌀 Chakra:</span>
        <div class="chakra-dots" id="p2-chakra-dots"></div>
      </div>

      <div class="bench-container" id="p2-bench"></div>
    </div>
  </div>

  <!-- CONTROLS PANEL -->
  <div class="controls-panel">
    <div class="action-buttons">
      <button class="btn-primary" id="btn-attack" onclick="handleAction('attack')">⚔️ Strike</button>
      <button class="btn-special" id="btn-jutsu" onclick="handleAction('jutsu')">🌀 Jutsu (4 Ck)</button>
      <button class="btn-special" id="btn-ultimate" onclick="handleAction('ultimate')" style="background: var(--accent-gold); color: black;">🔥 Ultimate (8 Ck)</button>
      <button id="btn-switch" onclick="handleAction('switch')">🔁 Switch Shinobi</button>
    </div>
  </div>

  <!-- LOG BOX -->
  <div class="log-box" id="game-log"></div>
</div>

<script>
// Elemental Cycle: Fire > Wind > Lightning > Earth > Water > Fire
const ELEMENT_ADV = { Fire: "Wind", Wind: "Lightning", Lightning: "Earth", Earth: "Water", Water: "Fire" };

class Shinobi {
  constructor(id, name, elem, hp, atk, def, spd, jutsuName, ultName) {
    this.id = id;
    this.name = name;
    this.elem = elem;
    this.maxHp = hp;
    this.hp = hp;
    this.atk = atk;
    this.def = def;
    this.spd = spd;
    this.jutsuName = jutsuName;
    this.ultName = ultName;
    this.statuses = [];
    this.isAlive = true;
  }
}

class Player {
  constructor(name, team, isAi = false) {
    this.name = name;
    this.team = team;
    this.activeIdx = 0;
    this.chakra = 3;
    this.maxChakra = 20;
    this.isAi = isAi;
  }

  getActive() { return this.team[this.activeIdx]; }
  
  addChakra(amt) { this.chakra = Math.min(this.maxChakra, this.chakra + amt); }

  isAlive() { return this.team.some(unit => unit.isAlive); }
}

// Initial Team Roster Setup
let p1 = new Player("Player 1", [
  new Shinobi("SB-0001", "Naruto Uzumaki", "Wind", 120, 35, 30, 35, "Rasengan", "Sage Mode Strike"),
  new Shinobi("SB-0004", "Kakashi Hatake", "Lightning", 115, 38, 32, 40, "Raikiri", "Kamui"),
  new Shinobi("SB-0003", "Sakura Haruno", "Earth", 130, 32, 35, 28, "Cherry Blossom Burst", "100 Heal Seal")
]);

let p2 = new Player("Player 2", [
  new Shinobi("SB-0002", "Sasuke Uchiha", "Lightning", 110, 40, 28, 38, "Chidori", "Kirin"),
  new Shinobi("SB-0032", "Gaara", "Earth", 135, 36, 48, 26, "Sand Tsunami", "Imperial Desert Funeral"),
  new Shinobi("SB-0010", "Itachi Uchiha", "Fire", 115, 45, 30, 42, "Fireball Jutsu", "Tsukuyomi")
], true);

let isPlayerTurn = true;

function log(msg, type = "sys") {
  const box = document.getElementById('game-log');
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.innerText = msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function updateUI() {
  // P1 Render
  const p1Active = p1.getActive();
  document.getElementById('p1-name').innerText = p1Active.name;
  document.getElementById('p1-elem').innerText = p1Active.elem;
  document.getElementById('p1-elem').className = `card-element element-${p1Active.elem}`;
  document.getElementById('p1-hp-fill').style.width = `${(p1Active.hp / p1Active.maxHp) * 100}%`;
  document.getElementById('p1-hp-text').innerText = `${Math.max(0, p1Active.hp)} /${p1Active.maxHp}`;
  document.getElementById('p1-atk').innerText = p1Active.atk;
  document.getElementById('p1-def').innerText = p1Active.def;
  document.getElementById('p1-spd').innerText = p1Active.spd;

  // P1 Chakra
  const p1ChakraBox = document.getElementById('p1-chakra-dots');
  p1ChakraBox.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = `chakra-dot ${i < p1.chakra ? 'active' : ''}`;
    p1ChakraBox.appendChild(dot);
  }

  // P1 Bench
  const p1Bench = document.getElementById('p1-bench');
  p1Bench.innerHTML = '';
  p1.team.forEach((unit, idx) => {
    const div = document.createElement('div');
    div.className = `bench-unit ${idx === p1.activeIdx ? 'active' : ''} ${!unit.isAlive ? 'dead' : ''}`;
    div.innerText = `${unit.name} (${unit.hp}HP)`;
    if (unit.isAlive && idx !== p1.activeIdx) {
      div.onclick = () => switchActive(p1, idx);
    }
    p1Bench.appendChild(div);
  });

  // P2 Render
  const p2Active = p2.getActive();
  document.getElementById('p2-name').innerText = p2Active.name;
  document.getElementById('p2-elem').innerText = p2Active.elem;
  document.getElementById('p2-elem').className = `card-element element-${p2Active.elem}`;
  document.getElementById('p2-hp-fill').style.width = `${(p2Active.hp / p2Active.maxHp) * 100}%`;
  document.getElementById('p2-hp-text').innerText = `${Math.max(0, p2Active.hp)} /${p2Active.maxHp}`;
  document.getElementById('p2-atk').innerText = p2Active.atk;
  document.getElementById('p2-def').innerText = p2Active.def;
  document.getElementById('p2-spd').innerText = p2Active.spd;

  // P2 Chakra
  const p2ChakraBox = document.getElementById('p2-chakra-dots');
  p2ChakraBox.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = `chakra-dot ${i < p2.chakra ? 'active' : ''}`;
    p2ChakraBox.appendChild(dot);
  }

  // P2 Bench
  const p2Bench = document.getElementById('p2-bench');
  p2Bench.innerHTML = '';
  p2.team.forEach((unit, idx) => {
    const div = document.createElement('div');
    div.className = `bench-unit ${idx === p2.activeIdx ? 'active' : ''} ${!unit.isAlive ? 'dead' : ''}`;
    div.innerText = `${unit.name} (${unit.hp}HP)`;
    p2Bench.appendChild(div);
  });

  // Control Buttons State
  document.getElementById('btn-jutsu').disabled = !isPlayerTurn || p1.chakra < 4;
  document.getElementById('btn-ultimate').disabled = !isPlayerTurn || p1.chakra < 8;
  document.getElementById('btn-attack').disabled = !isPlayerTurn;
  document.getElementById('btn-switch').disabled = !isPlayerTurn;
}

function calculateDamage(attacker, defender, basePower) {
  let dmg = basePower + (attacker.atk * 0.4);
  if (ELEMENT_ADV[attacker.elem] === defender.elem) {
    log(`🔥 Elemental Advantage! (${attacker.elem} >${defender.elem}) +25% Damage!`, isPlayerTurn ? "p1" : "p2");
    dmg *= 1.25;
  }
  const finalDmg = Math.max(1, Math.floor(dmg - (defender.def * 0.2)));
  return finalDmg;
}

function handleAction(type) {
  if (!isPlayerTurn) return;

  const attacker = p1.getActive();
  const defender = p2.getActive();

  if (type === 'attack') {
    log(`⚔️ ${attacker.name} attacks${defender.name}!`, "p1");
    const dmg = calculateDamage(attacker, defender, 15);
    defender.hp -= dmg;
    log(`💥 ${defender.name} took${dmg} damage!`, "p1");
  } else if (type === 'jutsu') {
    p1.chakra -= 4;
    log(`🌀 ${attacker.name} casts${attacker.jutsuName}!`, "p1");
    const dmg = calculateDamage(attacker, defender, 35);
    defender.hp -= dmg;
    log(`💥 ${defender.name} took${dmg} damage!`, "p1");
  } else if (type === 'ultimate') {
    p1.chakra -= 8;
    log(`🔥 ULTIMATE! ${attacker.name} unleashes${attacker.ultName}!`, "p1");
    const dmg = calculateDamage(attacker, defender, 65);
    defender.hp -= dmg;
    log(`💥 CRITICAL IMPACT! ${defender.name} took${dmg} damage!`, "p1");
  } else if (type === 'switch') {
    const nextIdx = p1.team.findIndex((u, i) => u.isAlive && i !== p1.activeIdx);
    if (nextIdx !== -1) {
      switchActive(p1, nextIdx);
    } else {
      log("⚠️ No other operational Shinobi to switch to!", "sys");
      return;
    }
  }

  checkFaints();
  if (p2.isAlive()) {
    isPlayerTurn = false;
    updateUI();
    setTimeout(aiTurn, 1000);
  }
}

function switchActive(player, idx) {
  player.activeIdx = idx;
  log(`🔁 ${player.name} switched to${player.getActive().name}!`, player.isAi ? "p2" : "p1");
  updateUI();
}

function checkFaints() {
  [p1, p2].forEach(p => {
    const active = p.getActive();
    if (active.hp <= 0 && active.isAlive) {
      active.hp = 0;
      active.isAlive = false;
      log(`💀 ${active.name} was defeated!`, p.isAi ? "p2" : "p1");
      
      const nextIdx = p.team.findIndex(u => u.isAlive);
      if (nextIdx !== -1) {
        p.activeIdx = nextIdx;
        log(`🔁 ${p.name} deploys${p.getActive().name}!`, p.isAi ? "p2" : "p1");
      }
    }
  });

  if (!p2.isAlive()) {
    log("🏆 VICTORY! You defeated Player 2!", "sys");
    disableAll();
  } else if (!p1.isAlive()) {
    log("💀 DEFEAT! Your team was wiped out!", "sys");
    disableAll();
  }
}

function disableAll() {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
}

function aiTurn() {
  log("🤖 Player 2 (AI) is thinking...", "p2");
  p2.addChakra(2);
  p1.addChakra(2);

  const attacker = p2.getActive();
  const defender = p1.getActive();

  setTimeout(() => {
    if (p2.chakra >= 8) {
      p2.chakra -= 8;
      log(`🔥 P2 ULTIMATE! ${attacker.name} uses${attacker.ultName}!`, "p2");
      const dmg = calculateDamage(attacker, defender, 65);
      defender.hp -= dmg;
      log(`💥 ${defender.name} took${dmg} damage!`, "p2");
    } else if (p2.chakra >= 4) {
      p2.chakra -= 4;
      log(`🌀 P2 CASTS JUTSU! ${attacker.name} uses${attacker.jutsuName}!`, "p2");
      const dmg = calculateDamage(attacker, defender, 35);
      defender.hp -= dmg;
      log(`💥 ${defender.name} took${dmg} damage!`, "p2");
    } else {
      log(`⚔️ P2 ATTACKS! ${attacker.name} strikes!`, "p2");
      const dmg = calculateDamage(attacker, defender, 15);
      defender.hp -= dmg;
      log(`💥 ${defender.name} took${dmg} damage!`, "p2");
    }

    checkFaints();
    if (p1.isAlive()) {
      isPlayerTurn = true;
    }
    updateUI();
  }, 800);
}

// Initial Launch Sequence
log("🎮 Match Started! Shinobi Bout v1.0", "sys");
log("💡 Elements: Fire > Wind > Lightning > Earth > Water > Fire", "sys");
updateUI();
</script>
</body>
</html>
