<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shinobi Bout - TCG Prototype</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-chakra: #38bdf8;
      --accent-hp: #ef4444;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { margin-bottom: 10px; color: var(--accent-chakra); text-shadow: 0 0 10px rgba(56,189,248,0.3); }

    .game-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-weight: bold;
    }

    .stat-box { display: flex; align-items: center; gap: 10px; }
    .hp-text { color: var(--accent-hp); }
    .chakra-text { color: var(--accent-chakra); }

    .battlefield {
      display: flex;
      justify-content: space-around;
      align-items: center;
      min-height: 220px;
      background: #090d16;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .vs-badge {
      font-size: 24px;
      font-weight: 900;
      color: #64748b;
    }

    .card {
      width: 140px;
      height: 200px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-chakra);
    }

    .card-title { font-size: 14px; font-weight: bold; text-align: center; }
    .card-cost {
      background: var(--accent-chakra);
      color: #000;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      align-self: flex-end;
    }

    .card-stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    .card-atk { color: #f59e0b; }
    .card-def { color: #10b981; }

    .hand-area {
      display: flex;
      gap: 15px;
      justify-content: center;
      min-height: 220px;
      padding: 10px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      background: var(--accent-chakra);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #0284c7; color: white; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

    .log-box {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      height: 100px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>SHINOBI BOUT</h1>

  <div class="game-container">
    <!-- Status Header -->
    <div class="status-bar">
      <div class="stat-box">
        <span>Enemy HP: <span id="enemy-hp" class="hp-text">20</span></span>
      </div>
      <div class="stat-box">
        <span>Turn: <span id="turn-count">1</span></span>
      </div>
      <div class="stat-box">
        <span>Your HP: <span id="player-hp" class="hp-text">20</span></span> |
        <span>Chakra: <span id="player-chakra" class="chakra-text">1/1</span></span>
      </div>
    </div>

    <!-- Battle Arena -->
    <div class="battlefield">
      <div id="player-active" class="card-slot">
        <p style="color:#64748b;">No Shinobi Deployed</p>
      </div>
      <div class="vs-badge">VS</div>
      <div id="enemy-active" class="card-slot">
        <p style="color:#64748b;">Enemy Slot Empty</p>
      </div>
    </div>

    <!-- Hand -->
    <div class="hand-area" id="player-hand"></div>

    <!-- Actions -->
    <div class="controls">
      <button id="attack-btn" onclick="attackPhase()" disabled>Attack!</button>
      <button id="end-turn-btn" onclick="endTurn()">End Turn</button>
    </div>

    <!-- Log -->
    <div class="log-box" id="game-log">
      Welcome to Shinobi Bout! Play a card to deploy a Shinobi.
    </div>
  </div>

  <script>
    // Game State
    let gameState = {
      turn: 1,
      playerHP: 20,
      enemyHP: 20,
      maxChakra: 1,
      currentChakra: 1,
      playerActive: null,
      enemyActive: null,
      hand: []
    };

    // Card Pool
    const cardDatabase = [
      { id: 1, name: "Genin Striker", cost: 1, atk: 3, def: 2 },
      { id: 2, name: "Shadow Clone", cost: 2, atk: 4, def: 1 },
      { id: 3, name: "Chunin Defender", cost: 2, atk: 2, def: 5 },
      { id: 4, name: "Jonin Elite", cost: 3, atk: 6, def: 4 }
    ];

    function log(msg) {
      const logBox = document.getElementById("game-log");
      logBox.innerHTML += `<div>> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
      document.getElementById("player-hp").innerText = gameState.playerHP;
      document.getElementById("enemy-hp").innerText = gameState.enemyHP;
      document.getElementById("player-chakra").innerText = `${gameState.currentChakra}/${gameState.maxChakra}`;
      document.getElementById("turn-count").innerText = gameState.turn;

      // Render Active Cards
      const pSlot = document.getElementById("player-active");
      if (gameState.playerActive) {
        pSlot.innerHTML = renderCardHTML(gameState.playerActive, false);
      } else {
        pSlot.innerHTML = `<p style="color:#64748b;">No Shinobi Deployed</p>`;
      }

      const eSlot = document.getElementById("enemy-active");
      if (gameState.enemyActive) {
        eSlot.innerHTML = renderCardHTML(gameState.enemyActive, false);
      } else {
        eSlot.innerHTML = `<p style="color:#64748b;">Enemy Slot Empty</p>`;
      }

      // Render Hand
      const handArea = document.getElementById("player-hand");
      handArea.innerHTML = "";
      gameState.hand.forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.innerHTML = renderCardHTML(card, true);
        cardEl.onclick = () => playCard(index);
        handArea.appendChild(cardEl.firstElementChild);
      });

      // Enable/Disable Attack Button
      document.getElementById("attack-btn").disabled = !gameState.playerActive;
    }

    function renderCardHTML(card, inHand) {
      return `
        <div class="card">
          <div class="card-cost">${card.cost}</div>
          <div class="card-title">${card.name}</div>
          <div class="card-stats">
            <span class="card-atk">ATK: ${card.atk}</span>
            <span class="card-def">DEF: ${card.def}</span>
          </div>
        </div>
      `;
    }

    function drawCard() {
      if (gameState.hand.length < 4) {
        const randomCard = cardDatabase[Math.floor(Math.random() * cardDatabase.length)];
        gameState.hand.push({ ...randomCard });
        log(`Drew ${randomCard.name}`);
      }
    }

    function playCard(handIndex) {
      const card = gameState.hand[handIndex];
      if (gameState.currentChakra < card.cost) {
        log("Not enough Chakra!");
        return;
      }

      gameState.currentChakra -= card.cost;
      gameState.playerActive = card;
      gameState.hand.splice(handIndex, 1);
      log(`Deployed ${card.name} to the field!`);
      updateUI();
    }

    function attackPhase() {
      if (!gameState.playerActive) return;

      const pAtk = gameState.playerActive.atk;
      if (gameState.enemyActive) {
        log(`Your ${gameState.playerActive.name} attacks enemy ${gameState.enemyActive.name}!`);
        const damage = Math.max(1, pAtk - gameState.enemyActive.def);
        gameState.enemyActive.def -= pAtk;
        
        if (gameState.enemyActive.def <= 0) {
          log(`Enemy ${gameState.enemyActive.name} was defeated!`);
          gameState.enemyActive = null;
        }
      } else {
        log(`Direct hit! Dealt ${pAtk} damage to Enemy Leader.`);
        gameState.enemyHP = Math.max(0, gameState.enemyHP - pAtk);
      }

      document.getElementById("attack-btn").disabled = true;
      updateUI();
      checkWinCondition();
    }

    function enemyTurn() {
      log("Enemy turn starting...");
      // Simple Enemy AI logic
      if (!gameState.enemyActive) {
        const randomCard = cardDatabase[Math.floor(Math.random() * 2)]; // plays simple card
        gameState.enemyActive = { ...randomCard };
        log(`Enemy deployed ${randomCard.name}!`);
      } else {
        log(`Enemy ${gameState.enemyActive.name} attacks!`);
        if (gameState.playerActive) {
          log(`Your ${gameState.playerActive.name} blocked the hit!`);
          gameState.playerActive.def -= gameState.enemyActive.atk;
          if (gameState.playerActive.def <= 0) {
            log(`Your ${gameState.playerActive.name} was destroyed!`);
            gameState.playerActive = null;
          }
        } else {
          gameState.playerHP = Math.max(0, gameState.playerHP - gameState.enemyActive.atk);
          log(`You took ${gameState.enemyActive.atk} direct damage!`);
        }
      }
      checkWinCondition();
    }

    function endTurn() {
      gameState.turn++;
      gameState.maxChakra = Math.min(10, gameState.maxChakra + 1);
      gameState.currentChakra = gameState.maxChakra;
      
      enemyTurn();
      drawCard();
      updateUI();
    }

    function checkWinCondition() {
      if (gameState.enemyHP <= 0) {
        alert("VICTORY! You defeated the enemy shinobi!");
        location.reload();
      } else if (gameState.playerHP <= 0) {
        alert("DEFEAT! Your chakra ran out!");
        location.reload();
      }
    }

    // Initialize Game
    drawCard();
    drawCard();
    updateUI();
  </script>
</body>
</html>
